patch:
  schema_list:  # 對於列表類型，現在無有辦法指定如何添加、消除或單一修改某項，於是要在定製檔中將整個列表替換！
    - schema: luna_pinyin
    - schema: rime_ice
  switcher/hotkeys: # 删除 ctrl + ` 的热键，以免与 VSCode 打开终端冲突
    - F4
  ascii_composer/switch_key/Shift_R: commit_code # 启用右 Shift 键切换中英文
  punctuator/half_shape:
    ',' : '，'
    '.' : '。'
    '<' : '《'
    '>' : '》'
    '/' : '/'
    '?' : '？'
    ';' : '；'
    ':' : '：'
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '\' : '、'
    '|' : '|'
    '`' : '·'
    '~' : '~'
    '!' : '！'
    '@' : '@'
    '#' : '#'
    '%' : '%'
    '$' : '$' # 半角模式下将中文的美元符号输入为英文美元符号, 便于输入 LaTeX 公式
    '^' : '……'
    '&' : '&'
    '*' : '*'
    '(' : '（'
    ')' : '）'
    '-' : '-'
    '_' : ——
    '+' : '+'
    '=' : '='
    '[' : [ 「, 【, ｛ ,［ ]
    ']' : [ 」, 】, ｝ ,］ ] # 将中括号符号设置为多选项输入
    '{' : '{'
    '}' : '}' # 半角模式下将中文的大括号输入为英文大括号
